charID: odyssevs
concept:
  appearance: |
     Dark-haired young man of modest build but with a very charming face
     and bright blue eyes.  He usually dresses poshly, like a diplomat or
     advisor to the high nobility, including moderately expensive jewelry.
     He favours dark blue and grey, although not quite as drark as to confuse 
     them with the official Tremere colours.  He keeps a worn set of clothing
     for rough fieldwork though.
  born: 1249
  charData:
    Alma Mater: Trablinum of Transilvania
    Casting Sigil: Rocking as if in rough sea
    Covenant: Zakiadnu
    Nationality: Ukrainian
    Saga: Novgorod Multi-Covenant Saga
    Size: 0
  charGlance: {}
  charType: Magus
  concept: Tremere Scout
  house: Tremere
  name: Odyssevs
  player: George
  quote: "Dear sodales, as you well know ..."
  quirk: "Tends to be overfriendly with anyone."
pregameAdvancement:
- mode: Virtues and Flaws
  changes:
  - comment: House Virtue
    cost: 0
    detail: Certamen
    virtue: Minor Magical Focus
  - cost: -3
    detail: Build the Hermetic Civilisation
    flaw: Higher Purpose (major)
    narrative: |
      Odyssevs have a vision of a great magical civilisation, founded
      on the ancient powers of Hermes.  His purpose is to grow the Order
      to the East, establishing a network of covenants reaching beyond
      the Ural, with solid communication lines.
  - cost: -1
    flaw: Ambitious
    narrative: |
      Althought Odyssevs is driven by the greater good of the House and the
      Order, he is very keen on taking the lead of its creation, and the
      personal ambition occasionally distracts him from the greater good.
  - comment: Story flaw
    virtue: Enemies
    detail: Faeries of the Sea
    narrative: 
    - |
      On one of the journeys on the Black Sea, Odyssevs and his master
      came into foul weather.  Trying to make this a learning opportunity,
      Salinator asked Odyssevs to make a spell to quiet the sea, but he botched,
      and the result angered the Faerie King of the Sea. 
    - |
      As a result, Odyssevs gave up his master's vocation, but he can nevery be 
      sure that the king does not have agents upriver.
    cost: -3
  - cost: 3
    detail: Satyr Blood
    virtue: Strong Faerie Blood
    narrative: |
      His mother never told Odyssevs about the eerie encounter in the woods
      on the Midsummer Night when she was betrothed to his father, and as a
      child, the faeries were nothing but a story to him.  Getting older,
      he has started to wonder about his appearance with unusually bright eyes
      and short foot blades, and having encountered faeries elsewhere, he
      is almost certain of some mystical heritage.
  - cost: 1
    detail: Intellego
    virtue: Affinity with (art)
  - cost: -1
    flaw: Hallucinations
    narrative: |
      Odyssevs hears voices, in particular a deep and impressive basso voice 
      which he attributes to Hermes.  He is convinced that it the ancient
      god directs his endeavour to build an empire in his name.
  - cost: -1
    flaw: Uncertain faith
    narrative: |
      Odyssevs is raised a Christian, but his reverence to Hermes is greater.
      Can he serve both gods?
  - cost: 3
    virtue: Elemental Magic
    narrative: |
      Odyssevs natural aptitude for the elements made him a good apprentice
      to Salinator, who specialised in Aquam and Auram for the control of the
      weather at sea.
  - cost: -1
    flaw: Sleep disorder
    narrative: |
      Odyssevs is easily bored, and when he zones out, he easily falls asleep.
      When he is busy on a project or distracted by an idea, he can work until 
      the early hours.
  - cost: 1
    virtue: Good teacher
  - cost: 1
    virtue: Inventive Genius
  - cost: 1
    virtue: Venus' Blessing
    narrative: |
      To be fair, Venus has nothing to do with this.
      It is almost certainly just another aspect of the Satyr blood.
  - ptrait: Uncertain faith
    score: 1
  - ptrait: Collaborative
    score: 1
  - ptrait: Ambitious
    score: 3
  - ptrait: Empire builder
    score: 6
